name: Preflight CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.9-alpine
        env:
          POSTGRES_USER: preflight
          POSTGRES_PASSWORD: preflight_local
          POSTGRES_DB: preflight_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U preflight -d preflight_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://preflight:preflight_local@127.0.0.1:55432/preflight_test
      DATABASE_URL: postgresql://preflight:preflight_local@127.0.0.1:55432/preflight_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run check:standards
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:standards
      - run: npm run build
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results
