pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Query strings may contain one-time OIDC authorization codes; never log them.
  log_format safe '$request_method $uri $status $body_bytes_sent $request_time';
  access_log /dev/stdout safe;
  server_tokens off;
  sendfile on;
  keepalive_timeout 30;
  # Docker service addresses can change during a rolling container replacement.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 3s;
  client_max_body_size 128k;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 'ok\n';
    }
    location /api/ {
      set $preflight_api http://api:3000;
      proxy_pass $preflight_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Connection '';
      proxy_connect_timeout 5s;
      proxy_read_timeout 35s;
      proxy_send_timeout 35s;
      add_header Cache-Control no-store always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header X-Frame-Options DENY always;
    }
    location /health/ {
      return 404;
    }
    location = /index.html {
      add_header Cache-Control 'no-store' always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header X-Frame-Options DENY always;
    }
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control 'no-cache' always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header X-Frame-Options DENY always;
    }
  }
}
